<div class="side-tags">
    <h3 class="side-title">
        <i class="layui-icon">&#xe674;</i>
        文章标签
    </h3>
    <div>
        {% for tag in sidebar_tags %}
            <a class="layui-btn layui-btn-xs layui-btn-primary"
               href="{{ url_for('blog.tag_posts', tag_id=tag.id) }}"
               style="color: {{ tag.color or '#5f9ea0' }}">{{ tag.name }}</a>
        {% else %}
            <span class="side-empty">暂无标签</span>
        {% endfor %}
    </div>
</div>
