<div class="side-categorys">
    <h3 class="side-title">
        <i class="layui-icon">&#xe705;</i>
        文章分类
    </h3>
    <ul>
        {% for category in sidebar_categories %}
            <li>
                <a href="{{ url_for('blog.category_posts', category_id=category.id) }}">
                    <i class="layui-icon">&#xe60a;</i>
                    <span class="side-text">{{ category.name }}</span>
                    <span class="layui-badge layui-bg-gray">{{ category.count }}</span>
                </a>
            </li>
        {% else %}
            <li class="side-empty">暂无分类</li>
        {% endfor %}
    </ul>
</div>
