<div class="side-newposts">
    <h3 class="side-title">
        <i class="layui-icon">&#xe663;</i>
        最新文章
    </h3>
    <ul>
        <!-- 显示5篇最新文章 -->
        {% for post in sidebar_recent_posts %}
            <li>
                <a href="{{ url_for('blog.post', post_id=post.id) }}" title="{{ post.title }}">
                    <i class="layui-icon">&#xe60a;</i>
                    <span class="side-text">{{ post.title }}</span>
                </a>
            </li>
        {% else %}
            <li class="side-empty">暂无文章</li>
        {% endfor %}
    </ul>
</div>
